[project]
name = "test-server"
version = "0.1.0"
description = "A test server with configurable success rate"
requires-python = ">=3.8"
dependencies = [
    "flask>=2.0.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"] 