[tool.poetry]
name = "mockserver"
version = "0.1.0"
description = "A mock server for testing purposes"
authors = ["Florencia Comuzzi <florenciacomuzzi@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
flask = "3.0.2"
pymongo = "4.6.3"
pytest = "8.0.2"
python-dotenv = "1.0.1"
pytest-mock = "3.12.0"
mongomock = "^4.3.0"


[tool.poetry.group.test.dependencies]
flake8 = "^7.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
